<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf6f3;--card:#fff;--tx:#3a2e2e;--mu:#8b7a78;--ac:#b5586b;--ac2:#f6e3e7;--ok:#4f8a6a;--bd:#eadbd7;--warn:#c0793a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1719;--card:#2a2124;--tx:#f3e9e7;--mu:#b4a09d;--ac:#e08a9c;--ac2:#41292f;--ok:#7cc79e;--bd:#3d3034;--warn:#e0a060}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1719;--card:#2a2124;--tx:#f3e9e7;--mu:#b4a09d;--ac:#e08a9c;--ac2:#41292f;--ok:#7cc79e;--bd:#3d3034;--warn:#e0a060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:center}
#couple{font:600 15px Georgia,"Times New Roman",serif;color:var(--ac);margin-top:2px}
h1{font:600 22px Georgia,"Times New Roman",serif;margin:0}
#sync{font-size:12px;color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--ac2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
.big{font:600 44px Georgia,serif;color:var(--ac);line-height:1}
.bar{height:9px;background:var(--ac2);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .m{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.done .t{text-decoration:line-through;color:var(--mu)}
form,.add{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
input,select{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:8px;min-width:0;flex:1 1 110px}
button.p{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;flex:none}
button.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:4px 8px}
button.tg{background:none;border:1px solid var(--bd);border-radius:14px;color:var(--mu);cursor:pointer;font-size:12px;padding:3px 9px}
button.tg.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
.tag{font-size:11px;background:var(--ac2);color:var(--ac);border-radius:8px;padding:1px 7px}
.ok{color:var(--ok)}.bad{color:var(--warn)}
.sw{display:flex;gap:6px;margin-bottom:10px}.sw button{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px;font:inherit;cursor:pointer}.sw .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}.chips button{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.gh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--tx);font:inherit;padding:0;cursor:pointer;text-align:left}.gh small{color:var(--mu);margin-left:6px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--ac2)}
.nt{width:100%;margin-top:4px;flex:none;font-size:13px}.bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.empty{color:var(--mu);font-size:13px;padding:6px 0}
.sc{overflow-x:auto}
</style>
</head>

<header><div><h1>💍 Wedding Planner</h1><div id="couple"></div></div><span id="sync">memuat…</span></header>

<main id="app"></main>

<script>

  apiKey:"AIzaSyDbtkR3ymIeCujvhdo1rKDF2ki7F_GGTCs",

const RAW=(()=>{let r='';try{r=decodeURIComponent(location.hash.slice(1))}catch(e){}return r})();

<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID'),uid=()=>Math.random().toString(36).slice(2,9),v=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const starters=['Tentukan tanggal & total budget','Diskusi konsep & jumlah tamu','Survei & booking venue','Pilih WO / vendor utama','Susun daftar tamu CPP & CPW','Fitting busana & cincin','Cetak / kirim undangan'];
const def=()=>({date:'',plan:'A',plans:{A:{target:0,items:[]},B:{target:0,items:[]},C:{target:0,items:[]}},savings:[],vendors:[],guests:[],ses:[],tasks:starters.map(t=>({id:uid(),t,due:'',who:'Bersama',done:false}))});
let S=def(),tab='dash',gf='all',vf='all',cmp=[],op={CPP:true,CPW:true},doc=null,last='',pending=false;
const tabs=[['dash','🏠 Dashboard'],['task','📝 Checklist'],['bud','💰 Budget'],['ven','💐 Vendor'],['gst','👥 Tamu'],['ses','🎁 Seserahan']];
const sync=t=>{$('#sync').textContent=t};
function save(){last=JSON.stringify(S);try{localStorage.setItem('wp-'+ROOM,last)}catch(e){}if(doc){doc.set({s:last}).then(()=>sync('● tersinkron')).catch(()=>sync('○ gagal sinkron (mode lokal)'))}render()}
const sum=(a,k)=>a.reduce((x,i)=>x+(+i[k]||0),0);
const plan=()=>S.plans[S.plan];
function dash(){
const today=ymd(new Date()),T=S.tasks,td=T.filter(t=>t.done).length,tp=T.length?Math.round(td/T.length*100):0,open=T.filter(t=>!t.done);
const late=open.filter(t=>t.due&&t.due<today).length,wk=ymd(new Date(Date.now()+7*864e5)),soon=open.filter(t=>t.due&&t.due>=today&&t.due<=wk).length;
const up=[...open].sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1).slice(0,3),who=w=>open.filter(t=>t.who===w).length;
let days='—',dt='Belum diisi';if(S.date){const d=new Date(S.date+'T00:00');dt=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});days=Math.ceil((d-new Date().setHours(0,0,0,0))/864e5);if(days<0)days='Sudah lewat';else if(days===0)days='Hari H!'}
const p=plan(),est=sum(p.items,'est'),paid=sum(p.items,'paid'),sv=sum(S.savings,'amt'),gap=sv-est,left=p.target-est;
const fv=S.vendors.filter(x=>x.fav),vc=[...new Set(S.vendors.map(x=>x.cat))],miss=vc.filter(c=>!fv.some(x=>x.cat===c));
const G=S.guests,inv=G.filter(x=>x.inv).length,ip=G.length?Math.round(inv/G.length*100):0,px=k=>sum(G.filter(x=>x.side===k),'pax');
const L=S.ses,sd=L.filter(x=>x.done).length,sp=L.length?Math.round(sd/L.length*100):0;
const parts=[T.length?tp:null,G.length?ip:null,L.length?sp:null,est?Math.round(Math.min(paid/est,1)*100):null].filter(x=>x!==null),all=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):0;
const sec=(t,k,b)=>`<div class="card"><h2 style="display:flex;justify-content:space-between;align-items:center"><span>${t}</span><button class="tg" data-act="tab" data-p="${k}">Buka →</button></h2>${b}</div>`;
const bar=n=>`<div class="bar"><i style="width:${n}%"></i></div>`;
const kv=(a,b,c)=>`<div class="row"><div class="m">${a}</div><b class="${c||''}">${b}</b></div>`;
return `<div class="card"><h2>Countdown</h2><div class="big">${esc(days)}${typeof days==='number'?'<small style="font-size:16px;color:var(--mu)"> hari lagi</small>':''}</div><div class="empty" style="margin:6px 0 10px">${esc(dt)}</div><div class="add"><input type="date" data-b="date" value="${esc(S.date)}" aria-label="Tanggal pernikahan"></div>
<div style="margin-top:6px"><b>Kesiapan ${all}%</b> <span class="empty">(rata-rata progres checklist, undangan, seserahan, dan pembayaran)</span>${bar(all)}</div></div>
${sec('📝 Checklist','task',`<b>${tp}%</b> <span class="empty">(${td}/${T.length} tugas selesai)</span>${bar(tp)}${kv('Lewat deadline',late,late?'bad':'ok')}${kv('Jatuh tempo 7 hari ke depan',soon)}${kv('Sisa tugas CPP / CPW / Bersama',who('CPP')+' / '+who('CPW')+' / '+who('Bersama'))}${up.length?'<div class="empty" style="margin-top:8px">Berikutnya:</div>'+up.map(t=>`<div class="row"><div class="m">${esc(t.t)}<small>${esc(t.who)}${t.due?' · '+esc(t.due):''}</small></div></div>`).join(''):'<div class="empty" style="margin-top:8px">Semua tugas selesai 🎉</div>'}`)}
${sec('💰 Budget Plan '+S.plan,'bud',`${kv('Target budget',p.target?rp(p.target):'belum diisi')}${kv('Total estimasi',rp(est))}${p.target?kv('Sisa dari target',(left>=0?'':'lebih ')+rp(Math.abs(left)),left>=0?'ok':'bad'):''}${kv('Sudah dibayar',rp(paid))}${kv('Belum dibayar',rp(est-paid))}${kv('Tabungan',rp(sv))}${kv('Tabungan vs estimasi',(gap>=0?'cukup, lebih ':'kurang ')+rp(Math.abs(gap)),gap>=0?'ok':'bad')}<div class="empty" style="margin-top:6px">Semua plan: ${['A','B','C'].map(k=>k+' '+rp(sum(S.plans[k].items,'est'))).join(' · ')}</div>`)}
${sec('💐 Vendor','ven',`<b>${fv.length}</b> <span class="empty">dari ${S.vendors.length} vendor dipilih</span>${fv.map(x=>kv(esc(x.cat)+' · <b>'+esc(x.name)+'</b>',rp(x.price))).join('')}${fv.length?kv('<b>Total vendor terpilih</b>',rp(sum(fv,'price'))):''}${miss.length?`<div class="empty" style="margin-top:6px">Belum ada pilihan: <span class="bad">${miss.map(esc).join(', ')}</span></div>`:''}${S.vendors.length?'':'<div class="empty">Belum ada vendor tersimpan.</div>'}`)}
${sec('👥 Tamu','gst',`${kv('Total undangan / pax',G.length+' / '+sum(G,'pax'))}${kv('Pax CPP / CPW',px('CPP')+' / '+px('CPW'))}${kv('Tamu VIP',G.filter(x=>x.vip).length)}${kv('Sudah diundang',inv+'/'+G.length+' ('+ip+'%)')}${bar(ip)}${G.length-inv?`<div class="empty">Belum diundang: <span class="bad">${G.length-inv}</span></div>`:''}`)}
${sec('🎁 Seserahan','ses',`<b>${sp}%</b> <span class="empty">(${sd}/${L.length} siap)</span>${bar(sp)}${kv('Estimasi biaya',rp(sum(L,'price')))}`)}`}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TPL=[[365,'Tentukan budget & konsep pernikahan'],[365,'Survei & booking venue'],[300,'Pilih WO / vendor utama'],[300,'Booking fotografer & videografer'],[240,'Booking katering'],[240,'Pilih MUA & busana'],[180,'Susun daftar tamu final'],[180,'Desain & pesan undangan'],[180,'Booking hiburan / MC'],[120,'Fitting busana pertama'],[120,'Pesan cincin & siapkan seserahan'],[90,'Sebar undangan'],[60,'Fitting busana terakhir'],[60,'Konfirmasi ulang semua vendor'],[30,'Gladi resik & susun rundown'],[30,'Finalisasi jumlah tamu'],[30,'Pelunasan vendor'],[7,'Siapkan perlengkapan hari H'],[0,'Hari H pernikahan 💍']];
function task(){const today=ymd(new Date()),ts=[...S.tasks].sort((a,b)=>a.done-b.done||((a.due||'9')>(b.due||'9')?1:-1));
return `<div class="card"><h2>Tambah tugas</h2><div class="add"><input id="tt" placeholder="Nama tugas"><input id="td" type="date"><select id="tw"><option>Bersama</option><option>CPP</option><option>CPW</option></select><button class="p" data-act="addTask">Tambah</button></div></div>
<div class="card"><h2>Template timeline</h2>${S.date?`<div class="empty" style="margin-bottom:8px">Isi tugas otomatis mundur dari tanggal nikah (${esc(S.date)}). Tugas dengan nama sama tidak diduplikasi.</div><button class="p" data-act="tpl">Buat timeline otomatis</button>`:'<div class="empty">Isi tanggal nikah di tab Dashboard dulu.</div>'}</div>
<div class="card"><h2>Daftar tugas & timeline</h2>${ts.map(t=>`<div class="row ${t.done?'done':''}"><input type="checkbox" style="flex:none" ${t.done?'checked':''} data-act="tg" data-l="tasks" data-k="done" data-id="${t.id}"><div class="m"><span class="t">${esc(t.t)}</span><small>${t.due?`<span class="${!t.done&&t.due<today?'bad':''}">Deadline ${esc(t.due)}${!t.done&&t.due<today?' (lewat)':''}</span> · `:''}<span class="tag">${esc(t.who)}</span></small></div><button class="x" data-act="del" data-l="tasks" data-id="${t.id}">✕</button></div>`).join('')||'<div class="empty">Belum ada tugas.</div>'}</div>`}
function bud(){const p=plan(),est=sum(p.items,'est'),paid=sum(p.items,'paid'),sv=sum(S.savings,'amt'),gap=sv-est;
return `<div class="sw">${['A','B','C'].map(k=>`<button class="${S.plan===k?'on':''}" data-act="plan" data-p="${k}">Plan ${k}</button>`).join('')}</div>
<div class="card"><h2>Ringkasan Plan ${S.plan}</h2><div class="add"><input type="number" data-b="target" placeholder="Target budget (Rp)" value="${p.target||''}"></div>
<div class="grid"><div class="stat"><b>${rp(est)}</b><span>Total estimasi</span></div><div class="stat"><b>${rp(paid)}</b><span>Sudah dibayar</span></div><div class="stat"><b class="${p.target&&est>p.target?'bad':'ok'}">${p.target?rp(p.target-est):'—'}</b><span>Sisa dari target</span></div><div class="stat"><b class="${gap>=0?'ok':'bad'}">${rp(gap)}</b><span>Tabungan vs estimasi</span></div></div></div>
<div class="card"><h2>Pos pengeluaran</h2><div class="add"><input id="in" placeholder="Pos (mis. Katering)"><input id="ie" type="number" placeholder="Estimasi"><input id="ip" type="number" placeholder="Dibayar"><button class="p" data-act="addItem">Tambah</button></div>
${p.items.map(i=>`<div class="row"><div class="m">${esc(i.n)}<small>Estimasi ${rp(i.est)} · ${+i.paid>=+i.est&&i.est?'<span class="ok">Lunas</span>':'Sisa '+rp(i.est-i.paid)}</small></div><input type="number" style="max-width:110px;flex:none" data-b="paid" data-id="${i.id}" value="${i.paid||0}" aria-label="Dibayar"><button class="x" data-act="del" data-l="items" data-id="${i.id}">✕</button></div>`).join('')||'<div class="empty">Belum ada pos di Plan '+S.plan+'.</div>'}</div>
<div class="card"><h2>Tabungan · ${rp(sv)}</h2><div class="add"><input id="sn" placeholder="Sumber (mis. Tabungan CPP)"><input id="sa" type="number" placeholder="Jumlah"><button class="p" data-act="addSave">Catat</button></div>
${S.savings.map(s=>`<div class="row"><div class="m">${esc(s.n)}</div><b>${rp(s.amt)}</b><button class="x" data-act="del" data-l="savings" data-id="${s.id}">✕</button></div>`).join('')}</div>`}
const cats=['Venue','Katering','Dekorasi','MUA & Busana','Foto & Video','Hiburan','Undangan','Lainnya'];
const waNum=t=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d};
function ven(){const all=S.vendors,f=all.filter(x=>vf==='all'||(vf==='fav'?x.fav:x.cat===vf)),g={};f.forEach(x=>(g[x.cat]=g[x.cat]||[]).push(x));
const chips=[['all','Semua ('+all.length+')'],['fav','✓ Dipilih ('+all.filter(x=>x.fav).length+')'],...cats.filter(c=>all.some(x=>x.cat===c)).map(c=>[c,c+' ('+all.filter(x=>x.cat===c).length+')'])];
if(!chips.some(c=>c[0]===vf))vf='all';
const cv=cmp.map(id=>all.find(x=>x.id===id)).filter(Boolean),mn=Math.min(...cv.map(x=>+x.price||0)),tr=(l,fn)=>`<tr><td><b>${l}</b></td>${cv.map(x=>`<td>${fn(x)}</td>`).join('')}</tr>`;
const cmpT=cv.length>1?`<div class="card"><h2>Perbandingan <button class="x" data-act="cmpx">Hapus ✕</button></h2><div class="sc"><table><tr><th></th>${cv.map(x=>`<th>${esc(x.name)}</th>`).join('')}</tr>${tr('Kategori',x=>esc(x.cat))}${tr('Paket',x=>esc(x.pkg)||'-')}${tr('Harga',x=>'<b>'+rp(x.price)+'</b>')}${tr('Selisih',x=>+x.price===mn?'<span class="ok">termurah</span>':'+'+rp(x.price-mn))}${tr('Catatan',x=>esc(x.note)||'-')}</table></div></div>`:cv.length===1?'<div class="empty" style="margin-bottom:8px">Pilih 1 vendor lagi dengan tombol ⇄ untuk membandingkan.</div>':'';
return `<div class="card"><h2>Tambah vendor</h2><div class="add"><select id="vc">${cats.map(c=>`<option>${c}</option>`).join('')}</select><input id="vn" placeholder="Nama vendor"><input id="vp" placeholder="Detail paket"><input id="vh" type="number" placeholder="Harga (Rp)"><input id="vw" type="tel" placeholder="No. WhatsApp"><input id="vt" placeholder="Catatan"><button class="p" data-act="addVen">Simpan</button></div></div>
<div class="chips">${chips.map(([k,l])=>`<button class="${vf===k?'on':''}" data-act="vf" data-p="${esc(k)}">${esc(l)}</button>`).join('')}</div>${cmpT}
${Object.keys(g).map(c=>{const min=Math.min(...g[c].map(x=>+x.price||0));return `<div class="card"><h2>${esc(c)}</h2>${g[c].map(x=>`<div class="row" style="align-items:flex-start"><div class="m"><b>${esc(x.name)}</b> ${g[c].length>1&&+x.price===min?'<span class="tag">termurah</span>':''}<small>${esc(x.pkg)}</small><b>${rp(x.price)}</b><input class="nt" data-b="vnote" data-id="${x.id}" placeholder="Catatan survei…" value="${esc(x.note)}"></div><div class="bt"><button class="tg ${x.fav?'on':''}" data-act="tg" data-l="vendors" data-k="fav" data-id="${x.id}">${x.fav?'✓ Dipilih':'Pilih'}</button><button class="tg ${cmp.includes(x.id)?'on':''}" data-act="cmp" data-id="${x.id}">⇄ Banding</button>${waNum(x.wa)?`<a class="tg" style="text-decoration:none" href="https://wa.me/${waNum(x.wa)}" target="_blank" rel="noopener">💬 Chat</a>`:''}<button class="x" data-act="del" data-l="vendors" data-id="${x.id}">✕</button></div></div>`).join('')}</div>`}).join('')||'<div class="empty">Tidak ada vendor di filter ini.</div>'}`}
function gst(){if(gf!=='VIP'&&gf!=='UN')gf='all';const px=s=>sum(S.guests.filter(x=>x.side===s),'pax'),inv=S.guests.filter(x=>x.inv).length;
const row=x=>`<div class="row"><div class="m">${esc(x.n)}<small>${x.pax} pax</small></div><button class="tg ${x.inv?'on':''}" data-act="tg" data-l="guests" data-k="inv" data-id="${x.id}">${x.inv?'✉ Diundang':'Belum'}</button><button class="tg ${x.vip?'on':''}" data-act="tg" data-l="guests" data-k="vip" data-id="${x.id}">★ VIP</button><button class="x" data-act="del" data-l="guests" data-id="${x.id}">✕</button></div>`;
const grp=s=>{const l=S.guests.filter(x=>x.side===s&&(gf!=='VIP'||x.vip)&&(gf!=='UN'||!x.inv));return `<div class="card"><button class="gh" data-act="op" data-p="${s}"><span><b>Tamu ${s}</b><small>${l.length} undangan · ${sum(l,'pax')} pax</small></span><span>${op[s]?'▲':'▼'}</span></button>${op[s]?`<div style="margin-top:8px">${l.map(row).join('')||'<div class="empty">Tidak ada tamu.</div>'}</div>`:''}</div>`};
return `<div class="grid"><div class="stat"><b>${px('CPP')}</b><span>Pax CPP</span></div><div class="stat"><b>${px('CPW')}</b><span>Pax CPW</span></div><div class="stat"><b>${inv}</b><span>Sudah diundang</span></div><div class="stat"><b>${S.guests.length-inv}</b><span>Belum diundang</span></div></div>
<div class="card" style="margin-top:12px"><h2>Tambah tamu</h2><div class="add"><input id="gn" placeholder="Nama tamu / keluarga"><select id="gs"><option>CPP</option><option>CPW</option></select><input id="gp" type="number" min="1" value="1" style="max-width:80px" aria-label="Pax"><button class="p" data-act="addGst">Tambah</button></div></div>
<div class="sw">${[['all','Semua'],['VIP','★ VIP'],['UN','Belum diundang']].map(([k,l])=>`<button class="${gf===k?'on':''}" data-act="gf" data-p="${k}">${l}</button>`).join('')}</div>${grp('CPP')}${grp('CPW')}`}
const sesCats=['Mahar','Seserahan','Hantaran lain'];
function ses(){const l=S.ses,d=l.filter(x=>x.done).length,pc=l.length?Math.round(d/l.length*100):0;
return `<div class="card"><h2>Mahar, seserahan & hantaran</h2><b>${pc}%</b> <span class="empty">(${d}/${l.length} siap · estimasi ${rp(sum(l,'price'))})</span><div class="bar"><i style="width:${pc}%"></i></div><div class="add"><select id="sc">${sesCats.map(c=>`<option>${c}</option>`).join('')}</select><input id="sn2" placeholder="Barang (mis. Alat sholat)"><input id="sp" type="number" placeholder="Estimasi harga"><button class="p" data-act="addSes">Tambah</button></div>${l.length?'':'<button class="tg" data-act="tplSes">+ Isi contoh daftar</button>'}</div>
${sesCats.map(c=>{const x=l.filter(i=>i.cat===c);return x.length?`<div class="card"><h2>${c}</h2>${x.map(i=>`<div class="row ${i.done?'done':''}"><input type="checkbox" style="flex:none" ${i.done?'checked':''} data-act="tg" data-l="ses" data-k="done" data-id="${i.id}"><div class="m"><span class="t">${esc(i.n)}</span>${i.price?`<small>${rp(i.price)}</small>`:''}</div><button class="x" data-act="del" data-l="ses" data-id="${i.id}">✕</button></div>`).join('')}</div>`:''}).join('')}`}
function render(){const a=$('#app'),y=scrollY;$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="tab" data-p="${k}">${l}</button>`).join('');a.innerHTML={dash,task,bud,ven,gst,ses}[tab]();scrollTo(0,y)}
const A={
tab(e){tab=e.p;render()},plan(e){S.plan=e.p;save()},gf(e){gf=e.p;render()},vf(e){vf=e.p;render()},op(e){op[e.p]=!op[e.p];render()},
addTask(){const t=v('tt');if(!t)return;S.tasks.push({id:uid(),t,due:v('td'),who:v('tw'),done:false});save()},
addItem(){const n=v('in');if(!n)return;plan().items.push({id:uid(),n,est:+v('ie')||0,paid:+v('ip')||0});save()},
addSave(){const n=v('sn');if(!n)return;S.savings.push({id:uid(),n,amt:+v('sa')||0});save()},
addVen(){const n=v('vn');if(!n)return;S.vendors.push({id:uid(),cat:v('vc'),name:n,pkg:v('vp'),price:+v('vh')||0,wa:v('vw'),note:v('vt'),fav:false});save()},
addGst(){const n=v('gn');if(!n)return;S.guests.push({id:uid(),n,side:v('gs'),pax:Math.max(1,+v('gp')||1),vip:false});save()},
tpl(){if(!S.date)return;const b=new Date(S.date+'T00:00');TPL.forEach(([d,t])=>{const o=new Date(b);o.setDate(o.getDate()-d);const e=S.tasks.find(x=>x.t===t);if(e){if(!e.due)e.due=ymd(o);return}S.tasks.push({id:uid(),t,due:ymd(o),who:'Bersama',done:false})});save()},
cmp(e){const i=cmp.indexOf(e.id);if(i>-1)cmp.splice(i,1);else{cmp.push(e.id);if(cmp.length>3)cmp.shift()}render()},cmpx(){cmp=[];render()},
addSes(){const n=v('sn2');if(!n)return;S.ses.push({id:uid(),cat:v('sc'),n,price:+v('sp')||0,done:false});save()},
tplSes(){[['Mahar','Mahar (uang / emas)'],['Seserahan','Alat sholat'],['Seserahan','Perhiasan'],['Seserahan','Busana'],['Seserahan','Sepatu & tas'],['Seserahan','Skincare & kosmetik'],['Hantaran lain','Kue & makanan'],['Hantaran lain','Buah-buahan']].forEach(([cat,n])=>S.ses.push({id:uid(),cat,n,price:0,done:false}));save()},
tg(e){const o=S[e.l].find(x=>x.id===e.id);if(o){o[e.k]=!o[e.k];save()}},
del(e){const L=e.l==='items'?plan().items:S[e.l],i=L.findIndex(x=>x.id===e.id);if(i>-1){L.splice(i,1);save()}}};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset)});
document.addEventListener('change',ev=>{const b=ev.target.dataset.b;if(!b)return;const x=ev.target.value;
if(b==='date')S.date=x;else if(b==='target')plan().target=+x||0;else if(b==='vnote'){const o=S.vendors.find(i=>i.id===ev.target.dataset.id);if(o)o.note=x}else if(b==='paid'){const o=plan().items.find(i=>i.id===ev.target.dataset.id);if(o)o.paid=+x||0}save()});
document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(render,50)}});
function load(j){try{const o=JSON.parse(j);if(o&&o.plans)S=Object.assign(def(),o)}catch(e){}}
try{const j=localStorage.getItem('wp-'+ROOM);if(j){load(j);last=j}}catch(e){}
const NAMES=(()=>{let h=RAW;
let p=h.split(/-dan-|-and-|&/i);if(p.length<2)p=h.split('-');
if(p.length<2||!p[0].trim()||!p[1].trim())return '';
const f=t=>t.replace(/[_-]+/g,' ').trim().replace(/(^|\s)\S/g,c=>c.toUpperCase());
return f(p[0])+' & '+f(p.slice(1).join(' '))})();
if(NAMES){$('#couple').textContent=NAMES;document.title=NAMES+' · Wedding Planner'}
addEventListener('hashchange',()=>location.reload());
render();
(async()=>{try{if(typeof firebase==='undefined'||FIREBASE_CONFIG.apiKey.startsWith('ISI')){sync('mode lokal (Firebase belum diisi)');return}
firebase.initializeApp(FIREBASE_CONFIG);
const ref=firebase.database().ref('wedding/'+ROOM);
doc={set:d=>ref.set(d),onSnapshot:(next,err)=>ref.on('value',x=>next({exists:x.exists(),data:()=>x.val()||{}}),e=>err&&err(e))};
sync('● menyambung…');
doc.onSnapshot(s=>{sync('● tersinkron');if(!s.exists){return}const j=s.data().s;if(j&&j!==last){last=j;load(j);const f=document.activeElement;if(f&&/INPUT|SELECT/.test(f.tagName)&&f.value)pending=true;else render()}},()=>sync('○ mode lokal'))}catch(e){sync('mode lokal')}})();
</script>
</body>
</html>
